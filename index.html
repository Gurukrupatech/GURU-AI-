<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>GURU AI - SWITY</title>

<style>

/* =================================
   RESET
================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    background:#020609;
}

body{
    font-family:Arial, sans-serif;
    color:white;
    overflow:hidden;
}


/* =================================
   MAIN APP
================================= */

.swity-app{
    width:100%;
    height:100vh;
    height:100svh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#020609;
}


/* =================================
   MAIN CONTAINER
================================= */

.background-container{
    position:relative;

    width:100%;
    height:100vh;
    height:100svh;

    max-width:600px;

    overflow:hidden;

    background:#020609;

    box-shadow:
    0 0 40px rgba(0,242,254,.15);
}


/* =================================
   BACKGROUND IMAGE
================================= */

.background-image{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    pointer-events:none;
    user-select:none;

    z-index:1;
}


/* =================================
   DARK OVERLAY
================================= */

.background-overlay{
    position:absolute;

    inset:0;

    background:
    linear-gradient(
        to bottom,
        rgba(0,3,8,.25),
        rgba(0,3,8,.08) 45%,
        rgba(0,3,8,.55) 100%
    );

    z-index:2;

    pointer-events:none;
}


/* =================================
   CYBER LIGHT
================================= */

.cyber-light{
    position:absolute;
    inset:0;

    z-index:3;

    pointer-events:none;

    overflow:hidden;

    mix-blend-mode:screen;
}

.cyber-light::before{
    content:"";

    position:absolute;

    width:35%;
    height:140%;

    top:-20%;
    left:-45%;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(0,242,254,.04),
        rgba(0,255,180,.16),
        rgba(0,242,254,.04),
        transparent
    );

    transform:skewX(-12deg);

    filter:blur(12px);

    animation:lightMove 9s linear infinite;
}

@keyframes lightMove{

    from{
        left:-45%;
    }

    to{
        left:120%;
    }

}


/* =================================
   PARTICLES
================================= */

.particles{
    position:absolute;

    inset:0;

    z-index:4;

    pointer-events:none;

    overflow:hidden;
}

.particle{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#00f2fe;

    box-shadow:
    0 0 6px #00f2fe,
    0 0 14px #00f2fe;

    animation:particleFloat linear infinite;
}

@keyframes particleFloat{

    0%{
        transform:translateY(20px) scale(.5);
        opacity:0;
    }

    15%{
        opacity:.7;
    }

    85%{
        opacity:.7;
    }

    100%{
        transform:translateY(-350px) scale(1.3);
        opacity:0;
    }

}


/* =================================
   TOP BRAND
================================= */

.top-brand{

    position:absolute;

    top:max(18px, env(safe-area-inset-top));

    left:50%;

    transform:translateX(-50%);

    display:flex;
    align-items:center;
    gap:9px;

    z-index:20;

    pointer-events:none;
}

.brand-logo{

    width:38px;
    height:38px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:19px;

    color:#00f2fe;

    border:1px solid rgba(0,242,254,.55);

    background:rgba(0,10,15,.45);

    box-shadow:
    0 0 12px rgba(0,242,254,.35),
    inset 0 0 10px rgba(0,242,254,.12);

    backdrop-filter:blur(8px);
}

.brand-text{

    display:flex;
    flex-direction:column;
}

.brand-title{

    font-size:14px;

    letter-spacing:2px;

    font-weight:bold;

    color:#ffffff;

    text-shadow:
    0 0 10px rgba(0,242,254,.7);
}

.brand-subtitle{

    margin-top:2px;

    font-size:8px;

    letter-spacing:2px;

    color:#00f2fe;

    opacity:.9;
}


/* =================================
   CHAT AREA
================================= */

.chat-area{

    position:absolute;

    left:0;
    right:0;

    top:46%;

    padding:0 20px;

    z-index:15;

    pointer-events:none;
}

.chat-message{

    max-width:82%;

    margin:auto;

    padding:14px 16px;

    border-radius:16px;

    background:
    linear-gradient(
        135deg,
        rgba(0,15,22,.50),
        rgba(0,5,12,.30)
    );

    border:1px solid rgba(0,242,254,.18);

    backdrop-filter:blur(7px);

    color:#ffffff;

    font-size:clamp(14px,4vw,18px);

    line-height:1.45;

    text-align:center;

    text-shadow:
    0 0 8px rgba(0,242,254,.35);

    box-shadow:
    0 0 20px rgba(0,242,254,.08);

    transition:.3s;
}


/* =================================
   BOTTOM CHAT BAR
================================= */

.chat-bar-wrapper{

    position:absolute;

    left:0;
    right:0;

    bottom:max(16px, env(safe-area-inset-bottom));

    padding:0 10px;

    z-index:50;
}

.chat-bar{

    width:100%;

    min-height:58px;

    display:flex;
    align-items:center;

    gap:7px;

    padding:6px;

    border-radius:18px;

    background:
    rgba(3,13,20,.82);

    border:
    1px solid rgba(0,242,254,.32);

    backdrop-filter:blur(15px);

    box-shadow:
    0 0 25px rgba(0,242,254,.12),
    inset 0 0 12px rgba(0,242,254,.04);
}


/* =================================
   SETTINGS BUTTON LEFT
================================= */

.settings-button{

    flex-shrink:0;

    width:45px;
    height:45px;

    border:none;

    border-radius:13px;

    background:
    rgba(0,242,254,.08);

    color:#00f2fe;

    font-size:21px;

    cursor:pointer;

    transition:.2s;

    border:
    1px solid rgba(0,242,254,.18);
}

.settings-button:active{

    transform:scale(.92);

    background:
    rgba(0,242,254,.18);
}


/* =================================
   INPUT
================================= */

.chat-input{

    flex:1;

    min-width:0;

    height:45px;

    padding:0 8px;

    border:none;
    outline:none;

    background:transparent;

    color:white;

    font-family:Arial, sans-serif;

    font-size:15px;
}

.chat-input::placeholder{

    color:
    rgba(255,255,255,.52);
}


/* =================================
   MIC BUTTON
================================= */

.mic-button{

    flex-shrink:0;

    width:45px;
    height:45px;

    border:none;

    border-radius:13px;

    background:
    rgba(0,242,254,.08);

    color:#00f2fe;

    font-size:19px;

    cursor:pointer;

    transition:.2s;

    border:
    1px solid rgba(0,242,254,.18);
}

.mic-button.listening{

    animation:micPulse 1s infinite;

    color:#00ff88;
}

@keyframes micPulse{

    0%{
        box-shadow:0 0 0 rgba(0,255,136,.0);
    }

    50%{
        box-shadow:0 0 20px rgba(0,255,136,.65);
    }

    100%{
        box-shadow:0 0 0 rgba(0,255,136,.0);
    }

}

.mic-button:active{

    transform:scale(.92);
}


/* =================================
   SEND BUTTON
================================= */

.send-button{

    flex-shrink:0;

    width:45px;
    height:45px;

    border:none;

    border-radius:13px;

    background:
    linear-gradient(
        135deg,
        #00c6d7,
        #00f2fe
    );

    color:#001014;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

    box-shadow:
    0 0 15px rgba(0,242,254,.35);
}

.send-button:active{

    transform:scale(.90);
}


/* =================================
   SETTINGS PANEL
================================= */

.settings-overlay{

    position:absolute;

    inset:0;

    background:
    rgba(0,0,0,.62);

    backdrop-filter:blur(5px);

    z-index:90;

    opacity:0;

    visibility:hidden;

    transition:.25s;
}

.settings-overlay.active{

    opacity:1;

    visibility:visible;
}


.settings-panel{

    position:absolute;

    left:0;
    bottom:0;

    width:100%;

    padding:
    20px 18px
    max(25px, env(safe-area-inset-bottom));

    background:
    linear-gradient(
        180deg,
        rgba(5,18,27,.98),
        rgba(1,7,12,.99)
    );

    border-top:
    1px solid rgba(0,242,254,.35);

    border-radius:
    24px 24px 0 0;

    transform:
    translateY(105%);

    transition:.35s ease;

    box-shadow:
    0 -10px 35px rgba(0,242,254,.12);
}

.settings-overlay.active
.settings-panel{

    transform:
    translateY(0);
}


.settings-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:18px;
}

.settings-title{

    color:#00f2fe;

    font-size:18px;

    letter-spacing:2px;

    font-weight:bold;
}

.close-settings{

    width:35px;
    height:35px;

    border:none;

    border-radius:10px;

    background:
    rgba(255,255,255,.06);

    color:white;

    font-size:18px;

    cursor:pointer;
}


.setting-item{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:14px 0;

    border-bottom:
    1px solid rgba(255,255,255,.07);
}

.setting-left{

    display:flex;

    flex-direction:column;

    gap:4px;
}

.setting-name{

    font-size:15px;

    color:white;
}

.setting-desc{

    font-size:11px;

    color:
    rgba(255,255,255,.45);
}


/* =================================
   SWITCH
================================= */

.switch{

    position:relative;

    width:48px;
    height:27px;
}

.switch input{

    opacity:0;

    width:0;
    height:0;
}

.slider{

    position:absolute;

    inset:0;

    cursor:pointer;

    border-radius:30px;

    background:#25333b;

    transition:.25s;
}

.slider:before{

    content:"";

    position:absolute;

    width:21px;
    height:21px;

    left:3px;
    top:3px;

    border-radius:50%;

    background:white;

    transition:.25s;
}

input:checked + .slider{

    background:#00d9e8;

    box-shadow:
    0 0 12px rgba(0,242,254,.4);
}

input:checked + .slider:before{

    transform:
    translateX(21px);
}


/* =================================
   SELECT
================================= */

.settings-select{

    max-width:135px;

    padding:8px;

    border-radius:8px;

    background:#07151d;

    color:#00f2fe;

    border:
    1px solid rgba(0,242,254,.22);

    outline:none;
}


/* =================================
   CLEAR BUTTON
================================= */

.clear-chat{

    width:100%;

    margin-top:18px;

    padding:13px;

    border-radius:12px;

    border:
    1px solid rgba(255,80,80,.35);

    background:
    rgba(255,50,50,.08);

    color:#ff8b8b;

    cursor:pointer;

    font-size:14px;
}


/* =================================
   DESKTOP
================================= */

@media(min-width:601px){

    .background-container{

        border-radius:16px;
    }

}


/* =================================
   SMALL MOBILE
================================= */

@media(max-width:380px){

    .chat-bar{

        gap:4px;

        padding:5px;
    }

    .settings-button,
    .mic-button,
    .send-button{

        width:41px;
        height:41px;
    }

    .chat-input{

        font-size:13px;
    }

}

</style>

</head>


<body>

<div class="swity-app">

<div class="background-container">


<!-- BACKGROUND -->

<img
src="background.png"
class="background-image"
alt="GURU AI SWITY"
>

<div class="background-overlay"></div>


<!-- CYBER LIGHT -->

<div class="cyber-light"></div>


<!-- PARTICLES -->

<div
class="particles"
id="particles">
</div>


<!-- TOP BRAND -->

<div class="top-brand">

    <div class="brand-logo">
        ✦
    </div>

    <div class="brand-text">

        <div class="brand-title">
            SWITY
        </div>

        <div class="brand-subtitle">
            GURU AI
        </div>

    </div>

</div>


<!-- CHAT MESSAGE -->

<div class="chat-area">

    <div
    class="chat-message"
    id="chatMessage">

        <b>SWITY:</b> I'm ready, Boss. How can I help you?

    </div>

</div>


<!-- BOTTOM CHATGPT STYLE BAR -->

<div class="chat-bar-wrapper">

<div class="chat-bar">


    <!-- SETTINGS LEFT -->

    <button
    class="settings-button"
    onclick="openSettings()"
    aria-label="Settings">

        ⚙

    </button>


    <!-- INPUT -->

    <input
    type="text"
    class="chat-input"
    id="userInput"
    placeholder="Ask Swity anything..."
    autocomplete="off"
    >


    <!-- MIC -->

    <button
    class="mic-button"
    id="micButton"
    onclick="startMic()"
    aria-label="Microphone">

        🎤

    </button>


    <!-- SEND -->

    <button
    class="send-button"
    onclick="sendMessage()"
    aria-label="Send">

        ➤

    </button>


</div>

</div>


<!-- SETTINGS OVERLAY -->

<div
class="settings-overlay"
id="settingsOverlay"
onclick="closeSettingsOutside(event)">

<div class="settings-panel">


    <!-- HEADER -->

    <div class="settings-header">

        <div class="settings-title">
            SWITY SETTINGS
        </div>

        <button
        class="close-settings"
        onclick="closeSettings()">

            ✕
        </button>

    </div>


    <!-- VOICE -->

    <div class="setting-item">

        <div class="setting-left">

            <div class="setting-name">
                Voice Assistant
            </div>

            <div class="setting-desc">
                Enable Swity voice replies
            </div>

        </div>


        <label class="switch">

            <input
            type="checkbox"
            id="voiceSwitch"
            checked
            onchange="changeVoice()">

            <span class="slider"></span>

        </label>

    </div>


    <!-- ANIMATION -->

    <div class="setting-item">

        <div class="setting-left">

            <div class="setting-name">
                Cyber Animation
            </div>

            <div class="setting-desc">
                Background particles and effects
            </div>

        </div>


        <label class="switch">

            <input
            type="checkbox"
            id="animationSwitch"
            checked
            onchange="toggleAnimation()">

            <span class="slider"></span>

        </label>

    </div>


    <!-- LANGUAGE -->

    <div class="setting-item">

        <div class="setting-left">

            <div class="setting-name">
                Voice Language
            </div>

            <div class="setting-desc">
                Select speaking language
            </div>

        </div>


        <select
        class="settings-select"
        id="languageSelect"
        onchange="changeLanguage()">

            <option value="en-IN">
                English
            </option>

            <option value="hi-IN">
                Hindi
            </option>

            <option value="mr-IN">
                Marathi
            </option>

        </select>

    </div>


    <!-- VOLUME -->

    <div class="setting-item">

        <div class="setting-left">

            <div class="setting-name">
                Voice Volume
            </div>

            <div class="setting-desc">
                Adjust Swity voice
            </div>

        </div>


        <input
        type="range"
        id="volumeControl"
        min="0"
        max="1"
        step="0.1"
        value="1"
        onchange="changeVolume()"
        >

    </div>


    <!-- CLEAR -->

    <button
    class="clear-chat"
    onclick="clearChat()">

        🗑 Clear Chat

    </button>


</div>

</div>


</div>

</div>


<script>

/* =================================
   PARTICLES
================================= */

const particleBox =
document.getElementById("particles");


for(let i=0;i<42;i++){

    const particle =
    document.createElement("div");

    particle.className =
    "particle";


    particle.style.left =
    Math.random()*100+"%";


    particle.style.top =
    Math.random()*100+"%";


    particle.style.animationDuration =
    (4+Math.random()*7)+"s";


    particle.style.animationDelay =
    (Math.random()*5)+"s";


    particleBox.appendChild(particle);

}


/* =================================
   SETTINGS VARIABLES
================================= */

let voiceEnabled=true;

let voiceLanguage="en-IN";

let voiceVolume=1;

let animationEnabled=true;


/* =================================
   SPEAK
================================= */

function speak(text){

    if(!voiceEnabled)return;

    if(!("speechSynthesis" in window))return;


    window.speechSynthesis.cancel();


    const speech =
    new SpeechSynthesisUtterance(text);


    speech.lang=
    voiceLanguage;


    speech.rate=.95;


    speech.pitch=1.15;


    speech.volume=
    voiceVolume;


    window.speechSynthesis.speak(speech);

}


/* =================================
   SEND MESSAGE
================================= */

function sendMessage(){

    const input =
    document.getElementById("userInput");


    const chatMessage =
    document.getElementById("chatMessage");


    const text =
    input.value.trim();


    if(text==="")return;


    chatMessage.innerHTML=
    "<b>BOSS:</b><br>"+text;


    input.value="";


    setTimeout(function(){


        const reply=
        "I'm ready, Boss. How can I help you?";


        chatMessage.innerHTML=
        "<b>SWITY:</b><br>"+reply;


        speak(reply);


    },600);

}


/* =================================
   ENTER KEY
================================= */

document
.getElementById("userInput")
.addEventListener(
"keydown",
function(event){

    if(event.key==="Enter"){

        event.preventDefault();

        sendMessage();

    }

});


/* =================================
   MICROPHONE
================================= */

function startMic(){

    const SpeechRecognition=

    window.SpeechRecognition ||

    window.webkitSpeechRecognition;


    const micButton=
    document.getElementById("micButton");


    const chatMessage=
    document.getElementById("chatMessage");


    if(!SpeechRecognition){

        chatMessage.innerHTML=
        "<b>SWITY:</b><br>Speech recognition is not supported in this browser.";

        return;

    }


    const recognition=
    new SpeechRecognition();


    recognition.lang=
    voiceLanguage;


    recognition.interimResults=
    false;


    recognition.maxAlternatives=
    1;


    recognition.start();


    micButton.classList.add(
    "listening"
    );


    chatMessage.innerHTML=
    "<b>SWITY:</b><br>Listening...";


    recognition.onresult=
    function(event){


        const transcript=
        event.results[0][0].transcript;


        document
        .getElementById("userInput")
        .value=
        transcript;


        micButton.classList.remove(
        "listening"
        );


        sendMessage();

    };


    recognition.onerror=
    function(){


        micButton.classList.remove(
        "listening"
        );


        chatMessage.innerHTML=
        "<b>SWITY:</b><br>Microphone permission required.";

    };


    recognition.onend=
    function(){

        micButton.classList.remove(
        "listening"
        );

    };

}


/* =================================
   OPEN SETTINGS
================================= */

function openSettings(){

    document
    .getElementById("settingsOverlay")
    .classList.add("active");

}


/* =================================
   CLOSE SETTINGS
================================= */

function closeSettings(){

    document
    .getElementById("settingsOverlay")
    .classList.remove("active");

}


/* =================================
   CLOSE OUTSIDE
================================= */

function closeSettingsOutside(event){

    if(
        event.target.id===
        "settingsOverlay"
    ){

        closeSettings();

    }

}


/* =================================
   CHANGE VOICE
================================= */

function changeVoice(){

    voiceEnabled=
    document
    .getElementById("voiceSwitch")
    .checked;


    if(!voiceEnabled){

        window
        .speechSynthesis
        .cancel();

    }

}


/* =================================
   CHANGE LANGUAGE
================================= */

function changeLanguage(){

    voiceLanguage=
    document
    .getElementById("languageSelect")
    .value;

}


/* =================================
   CHANGE VOLUME
================================= */

function changeVolume(){

    voiceVolume=
    parseFloat(

        document
        .getElementById("volumeControl")
        .value

    );

}


/* =================================
   TOGGLE ANIMATION
================================= */

function toggleAnimation(){

    animationEnabled=
    document
    .getElementById("animationSwitch")
    .checked;


    const particles=
    document
    .getElementById("particles");


    const cyberLight=
    document
    .querySelector(".cyber-light");


    if(animationEnabled){

        particles.style.display=
        "block";

        cyberLight.style.display=
        "block";

    }

    else{

        particles.style.display=
        "none";

        cyberLight.style.display=
        "none";

    }

}


/* =================================
   CLEAR CHAT
================================= */

function clearChat(){

    window
    .speechSynthesis
    .cancel();


    document
    .getElementById("chatMessage")
    .innerHTML=
    "<b>SWITY:</b><br>Chat cleared. I'm ready, Boss.";


    document
    .getElementById("userInput")
    .value=
    "";


    closeSettings();

}


/* =================================
   GREETING
================================= */

window.addEventListener(
"load",
function(){

    setTimeout(function(){

        speak(
        "Hello Boss. Welcome back. I am Swity, your personal AI assistant."
        );

    },1000);

});

</script>

</body>
</html>
