<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>GURU AI - SWITY</title>

<style>

/* ===============================
   RESET
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#020609;
}

body{
    font-family:Arial,sans-serif;
    overflow:hidden;
    color:white;
}


/* ===============================
   MAIN APP
================================ */

.swity-app{
    width:100%;
    height:100vh;
    min-height:100svh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#020609;
}


/* ===============================
   BACKGROUND CONTAINER
================================ */

.background-container{
    position:relative;

    width:100%;
    height:100vh;
    min-height:100svh;

    max-width:600px;

    overflow:hidden;

    background:#020609;

    box-shadow:
    0 0 40px rgba(0,242,254,.18);
}


/* ===============================
   BACKGROUND IMAGE
================================ */

.background-image{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center top;

    display:block;

    user-select:none;

    pointer-events:none;

    z-index:1;
}


/* ===============================
   ANIMATED CYBER LIGHT
================================ */

.cyber-light{
    position:absolute;
    inset:0;

    z-index:5;

    pointer-events:none;

    overflow:hidden;

    mix-blend-mode:screen;
}

.cyber-light::before{
    content:"";

    position:absolute;

    width:35%;
    height:140%;

    top:-20%;
    left:-45%;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(0,242,254,.05),
        rgba(0,255,180,.18),
        rgba(0,242,254,.05),
        transparent
    );

    transform:skewX(-12deg);

    filter:blur(12px);

    animation:lightMove 8s linear infinite;
}

.cyber-light::after{
    content:"";

    position:absolute;

    inset:0;

    background:

    radial-gradient(
        circle at 50% 30%,
        rgba(0,242,254,.10),
        transparent 25%
    ),

    radial-gradient(
        circle at 50% 80%,
        rgba(0,255,120,.08),
        transparent 28%
    );

    animation:pulseLight 4s ease-in-out infinite alternate;
}

@keyframes lightMove{

    from{
        left:-45%;
    }

    to{
        left:120%;
    }

}

@keyframes pulseLight{

    from{
        opacity:.25;
    }

    to{
        opacity:.85;
    }

}


/* ===============================
   PARTICLES
================================ */

.particles{
    position:absolute;

    inset:0;

    z-index:6;

    pointer-events:none;

    overflow:hidden;
}

.particle{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#00f2fe;

    box-shadow:
    0 0 6px #00f2fe,
    0 0 14px #00f2fe;

    animation:particleFloat linear infinite;
}

@keyframes particleFloat{

    0%{
        transform:translateY(20px) scale(.5);
        opacity:0;
    }

    15%{
        opacity:.8;
    }

    85%{
        opacity:.8;
    }

    100%{
        transform:translateY(-350px) scale(1.4);
        opacity:0;
    }

}


/* ===============================
   CHAT MESSAGE
================================ */

#chatMessage{
    position:absolute;

    left:18%;
    top:48%;

    width:64%;
    height:7%;

    overflow-y:auto;

    padding:5px 8px;

    color:white;

    font-size:clamp(12px,3vw,17px);

    line-height:1.25;

    text-shadow:
    0 0 8px rgba(0,242,254,.4);

    z-index:20;

    pointer-events:none;
}


/* ===============================
   ALL INTERACTIVE ELEMENTS
================================ */

.menu-button,
.settings-button,
.chat-input,
.send-button,
.mic-button,
.control-settings,
.voice-button{
    position:absolute;

    z-index:30;
}


/* ===============================
   MENU BUTTON
================================ */

.menu-button{
    top:2%;
    left:2%;

    width:12%;
    height:7%;

    border:none;

    background:transparent;

    cursor:pointer;
}


/* ===============================
   TOP SETTINGS
================================ */

.settings-button{
    top:2%;
    right:2%;

    width:12%;
    height:7%;

    border:none;

    background:transparent;

    cursor:pointer;
}


/* ===============================
   CHAT INPUT
================================ */

.chat-input{
    left:18%;
    top:56.3%;

    width:54%;
    height:4.8%;

    padding:6px 8px;

    border:none;
    outline:none;

    background:transparent;

    color:white;

    font-family:Arial,sans-serif;

    font-size:clamp(12px,3vw,18px);
}

.chat-input::placeholder{
    color:rgba(255,255,255,.55);
}


/* ===============================
   SEND BUTTON
================================ */

.send-button{
    top:56.2%;
    left:73%;

    width:11%;
    height:5.5%;

    border:none;

    background:transparent;

    cursor:pointer;

    border-radius:15px;
}

.send-button:active{
    transform:scale(.90);
}


/* ===============================
   MIC BUTTON
================================ */

.mic-button{
    left:17%;
    top:62.5%;

    width:21%;
    height:5.5%;

    border:none;

    background:transparent;

    cursor:pointer;
}


/* ===============================
   SETTINGS CONTROL
================================ */

.control-settings{
    left:39%;
    top:62.5%;

    width:21%;
    height:5.5%;

    border:none;

    background:transparent;

    cursor:pointer;
}


/* ===============================
   VOICE BUTTON
================================ */

.voice-button{
    left:62%;
    top:62.5%;

    width:22%;
    height:5.5%;

    border:none;

    background:transparent;

    cursor:pointer;
}


/* ===============================
   MOBILE
================================ */

@media(max-width:600px){

    .background-container{
        width:100%;
        max-width:none;
        height:100svh;
    }

}


/* ===============================
   DESKTOP
================================ */

@media(min-width:601px){

    .background-container{
        border-radius:12px;
    }

}

</style>
</head>


<body>

<div class="swity-app">

<div class="background-container">


<!-- BACKGROUND IMAGE -->

<img
src="background.png"
class="background-image"
alt="GURU AI SWITY"
>


<!-- ANIMATED LIGHT -->

<div class="cyber-light"></div>


<!-- PARTICLES -->

<div
class="particles"
id="particles">
</div>


<!-- CHAT MESSAGE -->

<div
id="chatMessage">
Hello Boss. Welcome back.
</div>


<!-- MENU -->

<button
class="menu-button"
onclick="openMenu()"
aria-label="Menu">
</button>


<!-- TOP SETTINGS -->

<button
class="settings-button"
onclick="openSettings()"
aria-label="Settings">
</button>


<!-- CHAT INPUT -->

<input
type="text"
class="chat-input"
id="userInput"
placeholder="Ask Swity anything..."
autocomplete="off"
>


<!-- SEND -->

<button
class="send-button"
onclick="sendMessage()"
aria-label="Send">
</button>


<!-- MICROPHONE -->

<button
class="mic-button"
onclick="startMic()"
aria-label="Microphone">
</button>


<!-- SETTINGS -->

<button
class="control-settings"
onclick="openSettings()"
aria-label="Settings">
</button>


<!-- VOICE -->

<button
class="voice-button"
onclick="toggleVoice()"
aria-label="Voice">
</button>


</div>

</div>


<script>

/* ===============================
   PARTICLES
================================ */

const particleBox =
document.getElementById("particles");


for(let i=0;i<45;i++){

    const particle =
    document.createElement("div");

    particle.className =
    "particle";


    particle.style.left =
    Math.random()*100+"%";


    particle.style.top =
    Math.random()*100+"%";


    particle.style.animationDuration =
    (4+Math.random()*7)+"s";


    particle.style.animationDelay =
    (Math.random()*5)+"s";


    particleBox.appendChild(particle);

}


/* ===============================
   VOICE
================================ */

let voiceEnabled=true;


/* ===============================
   SPEAK
================================ */

function speak(text){

    if(!voiceEnabled)return;

    if(!("speechSynthesis" in window))return;

    window.speechSynthesis.cancel();

    const speech =
    new SpeechSynthesisUtterance(text);

    speech.lang="en-IN";

    speech.rate=.95;

    speech.pitch=1.15;

    speech.volume=1;

    window.speechSynthesis.speak(speech);

}


/* ===============================
   SEND MESSAGE
================================ */

function sendMessage(){

    const input =
    document.getElementById("userInput");

    const chatMessage =
    document.getElementById("chatMessage");

    const text =
    input.value.trim();


    if(text==="")return;


    chatMessage.innerHTML =
    "<b>BOSS:</b> "+text;


    input.value="";


    setTimeout(function(){

        const reply =
        "I'm ready, Boss. How can I help you?";


        chatMessage.innerHTML =
        "<b>SWITY:</b> "+reply;


        speak(reply);

    },700);

}


/* ===============================
   ENTER KEY
================================ */

document
.getElementById("userInput")
.addEventListener(
    "keydown",
    function(event){

        if(event.key==="Enter"){

            sendMessage();

        }

    }
);


/* ===============================
   VOICE TOGGLE
================================ */

function toggleVoice(){

    voiceEnabled=!voiceEnabled;


    if(voiceEnabled){

        document
        .getElementById("chatMessage")
        .innerHTML=
        "<b>SWITY:</b> Voice activated.";

        speak("Voice activated Boss");

    }

    else{

        window.speechSynthesis.cancel();

        document
        .getElementById("chatMessage")
        .innerHTML=
        "<b>SWITY:</b> Voice disabled.";

    }

}


/* ===============================
   MICROPHONE
================================ */

function startMic(){

    const SpeechRecognition=

    window.SpeechRecognition ||

    window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        document
        .getElementById("chatMessage")
        .innerHTML=
        "<b>SWITY:</b> Speech recognition is not supported in this browser.";

        return;

    }


    const recognition=
    new SpeechRecognition();


    recognition.lang="en-IN";

    recognition.interimResults=false;

    recognition.maxAlternatives=1;


    recognition.start();


    document
    .getElementById("chatMessage")
    .innerHTML=
    "<b>SWITY:</b> Listening...";


    recognition.onresult=
    function(event){

        const transcript=
        event.results[0][0].transcript;


        document
        .getElementById("userInput")
        .value=transcript;


        sendMessage();

    };


    recognition.onerror=
    function(){

        document
        .getElementById("chatMessage")
        .innerHTML=
        "<b>SWITY:</b> Microphone permission required.";

    };

}


/* ===============================
   SETTINGS
================================ */

function openSettings(){

    const chatMessage=
    document.getElementById("chatMessage");


    chatMessage.innerHTML=
    "<b>SWITY SETTINGS</b><br>" +
    "AI: ACTIVE<br>" +
    "CORE: ONLINE<br>" +
    "VOICE: " +
    (voiceEnabled?"ON":"OFF");

}


/* ===============================
   MENU
================================ */

function openMenu(){

    document
    .getElementById("chatMessage")
    .innerHTML=
    "<b>GURU AI</b><br>" +
    "SWITY AI ASSISTANT<br>" +
    "SYSTEM ONLINE";

}


/* ===============================
   GREETING
================================ */

window.addEventListener(
    "load",
    function(){

        setTimeout(function(){

            speak(
                "Hello Boss. Welcome back. I am Swity, your personal AI assistant."
            );

        },1000);

    }
);

</script>

</body>
</html>
