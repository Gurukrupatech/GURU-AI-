<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GURU AI - SWITY</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --cyan:#00f2fe;
    --blue:#4facfe;
    --purple:#b600ff;
    --pink:#ff00c8;
    --dark:#020208;
    --glass:rgba(8,12,30,.62);
}

body{
    min-height:100vh;
    overflow-x:hidden;
    background:#020208;
    color:white;
    font-family:Rajdhani,sans-serif;
}

/* ================= BACKGROUND ================= */

.background{
    position:fixed;
    inset:0;
    z-index:-5;
    overflow:hidden;

    background:
    radial-gradient(circle at 20% 30%,rgba(0,242,254,.15),transparent 30%),
    radial-gradient(circle at 80% 20%,rgba(182,0,255,.18),transparent 35%),
    linear-gradient(180deg,#020208,#060018,#020208);

    animation:bgMove 10s infinite alternate ease-in-out;
}

@keyframes bgMove{
    0%{filter:hue-rotate(0deg) brightness(.8);}
    100%{filter:hue-rotate(20deg) brightness(1.15);}
}

/* CITY */

.city{
    position:absolute;
    bottom:0;
    width:100%;
    height:40%;

    background:
    linear-gradient(90deg,
    transparent 0 4%,
    rgba(0,242,254,.4) 4% 4.5%,
    transparent 4.5% 8%,
    rgba(182,0,255,.35) 8% 8.6%,
    transparent 8.6% 14%,
    rgba(0,242,254,.3) 14% 14.5%,
    transparent 14.5% 21%,
    rgba(255,0,200,.35) 21% 21.6%,
    transparent 21.6% 100%),

    linear-gradient(to top,
    #020208,
    rgba(8,0,25,.85),
    transparent);

    opacity:.9;
}

/* GRID */

.grid{
    position:absolute;
    bottom:-20%;
    width:100%;
    height:55%;

    background-image:
    linear-gradient(rgba(0,242,254,.2) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,242,254,.2) 1px,transparent 1px);

    background-size:45px 45px;

    transform:
    perspective(400px)
    rotateX(60deg)
    scale(1.5);

    animation:gridMove 4s linear infinite;

    opacity:.3;
}

@keyframes gridMove{
    from{background-position:0 0;}
    to{background-position:0 45px;}
}

/* LIGHT BEAMS */

.beam{
    position:absolute;
    width:2px;
    height:120%;
    top:-20%;
    filter:blur(1px);
    opacity:.5;
    animation:beamMove 5s infinite linear;
}

.beam.one{
    left:15%;
    background:linear-gradient(transparent,var(--cyan),transparent);
}

.beam.two{
    left:70%;
    background:linear-gradient(transparent,var(--purple),transparent);
    animation-delay:-2s;
}

.beam.three{
    left:45%;
    background:linear-gradient(transparent,var(--pink),transparent);
    animation-delay:-4s;
}

@keyframes beamMove{
    0%{transform:translateY(-20%) rotate(10deg);}
    50%{opacity:1;}
    100%{transform:translateY(20%) rotate(10deg);}
}

/* PARTICLES */

#particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
}

.particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 12px var(--cyan);
    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(110vh);
        opacity:0;
    }

    20%{opacity:1;}

    to{
        transform:translateY(-10vh);
        opacity:0;
    }
}

/* ================= MAIN APP ================= */

.app{
    width:min(100%,480px);
    min-height:100vh;
    margin:auto;
    padding:16px 14px 30px;
    position:relative;
}

/* TOP BAR */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.brand{
    font-family:Orbitron;
    font-size:12px;
    letter-spacing:3px;
    color:var(--cyan);
    text-shadow:0 0 12px var(--cyan);
}

.online{
    font-family:Orbitron;
    font-size:9px;
    color:#00ff88;
    border:1px solid #00ff88;
    padding:5px 8px;
    border-radius:20px;
    box-shadow:0 0 12px rgba(0,255,136,.5);
}

/* TITLE */

.title{
    text-align:center;
    margin:12px 0 4px;
}

.title h1{
    font-family:Orbitron;
    font-size:35px;
    letter-spacing:8px;
    color:white;
    text-shadow:
    0 0 8px var(--cyan),
    0 0 25px var(--purple);
}

.title p{
    margin-top:5px;
    font-size:12px;
    letter-spacing:4px;
    color:var(--cyan);
}

/* HUD */

.hud{
    display:flex;
    justify-content:space-between;
    margin:10px 0;
}

.hud-box{
    width:31%;
    height:58px;
    padding:7px;

    border:1px solid rgba(0,242,254,.35);
    border-radius:10px;

    background:var(--glass);
    backdrop-filter:blur(10px);

    box-shadow:
    inset 0 0 15px rgba(0,242,254,.08),
    0 0 12px rgba(0,242,254,.12);
}

.hud-box span{
    font-size:9px;
    color:#8d9bb5;
}

.hud-box b{
    display:block;
    margin-top:7px;
    color:var(--cyan);
    font-family:Orbitron;
    font-size:11px;
}

/* ================= AVATAR ================= */

.avatar-area{
    height:310px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.ring{
    position:absolute;
    border-radius:50%;
    border:2px solid var(--cyan);

    box-shadow:
    0 0 15px var(--cyan),
    inset 0 0 15px rgba(0,242,254,.3);
}

.ring1{
    width:260px;
    height:260px;
    border-style:dashed;
    animation:rotate 14s linear infinite;
}

.ring2{
    width:225px;
    height:225px;
    border-color:var(--purple);
    animation:rotateReverse 9s linear infinite;
}

.ring3{
    width:195px;
    height:195px;
    border-style:dotted;
    animation:rotate 7s linear infinite;
}

@keyframes rotate{
    to{transform:rotate(360deg);}
}

@keyframes rotateReverse{
    to{transform:rotate(-360deg);}
}

.avatar{
    width:165px;
    height:165px;
    border-radius:50%;
    position:relative;
    overflow:hidden;

    background:
    radial-gradient(circle,
    #263d66 0%,
    #07122c 45%,
    #01030a 75%);

    border:2px solid var(--cyan);

    box-shadow:
    0 0 20px var(--cyan),
    0 0 55px var(--purple),
    inset 0 0 30px rgba(0,242,254,.25);

    animation:pulse 3s ease-in-out infinite;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
        box-shadow:
        0 0 20px var(--cyan),
        0 0 55px var(--purple);
    }

    50%{
        transform:scale(1.04);
        box-shadow:
        0 0 35px var(--cyan),
        0 0 80px var(--purple);
    }
}

.avatar::before{
    content:"SWITY";
    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Orbitron;
    font-size:24px;
    font-weight:bold;
    letter-spacing:3px;

    color:white;

    text-shadow:
    0 0 10px var(--cyan),
    0 0 25px var(--purple);
}

.avatar::after{
    content:"AI CORE";
    position:absolute;
    bottom:38px;
    left:0;
    width:100%;

    text-align:center;
    font-family:Orbitron;
    font-size:8px;
    letter-spacing:4px;
    color:var(--cyan);
}

/* SYSTEM LABEL */

.system{
    position:absolute;
    bottom:14px;
    font-family:Orbitron;
    font-size:9px;
    letter-spacing:3px;
    color:#00ff88;
}

/* ================= CHAT ================= */

.chat{
    background:var(--glass);

    border:1px solid rgba(0,242,254,.45);

    border-radius:18px;

    padding:16px;

    backdrop-filter:blur(15px);

    box-shadow:
    0 0 25px rgba(0,242,254,.12),
    inset 0 0 20px rgba(182,0,255,.08);
}

.chat small{
    color:var(--cyan);
    letter-spacing:2px;
}

.message{
    margin-top:8px;
    font-size:17px;
    line-height:1.3;
}

/* INPUT */

.input-box{
    display:flex;
    margin-top:14px;
    gap:8px;
}

input{
    flex:1;
    min-width:0;
    border:none;
    outline:none;

    padding:14px;

    border-radius:12px;

    color:white;

    background:rgba(0,0,0,.45);

    border:1px solid rgba(0,242,254,.35);

    font-family:Rajdhani;
    font-size:16px;
}

input:focus{
    box-shadow:0 0 15px rgba(0,242,254,.35);
}

.send{
    border:none;
    width:52px;

    border-radius:12px;

    color:#001;
    font-size:20px;

    background:var(--cyan);

    box-shadow:0 0 20px var(--cyan);

    cursor:pointer;
}

/* ================= CONTROLS ================= */

.controls{
    display:flex;
    gap:8px;
    margin-top:14px;
}

.control{
    flex:1;

    padding:12px 5px;

    border-radius:10px;

    background:rgba(5,8,25,.7);

    border:1px solid rgba(0,242,254,.3);

    color:white;

    font-family:Orbitron;
    font-size:9px;

    cursor:pointer;

    transition:.25s;
}

.control:active{
    transform:scale(.95);
}

.control.active{
    color:var(--cyan);

    box-shadow:
    0 0 15px rgba(0,242,254,.4),
    inset 0 0 10px rgba(0,242,254,.1);
}

/* BOTTOM STATUS */

.status{
    text-align:center;
    margin-top:18px;

    font-family:Orbitron;

    font-size:8px;

    letter-spacing:3px;

    color:#61708d;
}

@media(max-width:370px){

    .title h1{
        font-size:28px;
    }

    .avatar-area{
        height:280px;
    }

    .ring1{
        width:230px;
        height:230px;
    }

    .ring2{
        width:200px;
        height:200px;
    }

    .ring3{
        width:175px;
        height:175px;
    }

    .avatar{
        width:150px;
        height:150px;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="city"></div>
    <div class="grid"></div>

    <div class="beam one"></div>
    <div class="beam two"></div>
    <div class="beam three"></div>
</div>

<div id="particles"></div>

<main class="app">

    <div class="top">
        <div class="brand">GURUKRUPATECH</div>
        <div class="online">● ONLINE</div>
    </div>

    <div class="title">
        <h1>SWITY</h1>
        <p>GURU AI ASSISTANT</p>
    </div>

    <div class="hud">

        <div class="hud-box">
            <span>AI STATUS</span>
            <b>ACTIVE</b>
        </div>

        <div class="hud-box">
            <span>CORE</span>
            <b>ONLINE</b>
        </div>

        <div class="hud-box">
            <span>VOICE</span>
            <b id="voiceStatus">ON</b>
        </div>

    </div>

    <div class="avatar-area">

        <div class="ring ring1"></div>
        <div class="ring ring2"></div>
        <div class="ring ring3"></div>

        <div class="avatar"></div>

        <div class="system">SYSTEM ONLINE</div>

    </div>

    <section class="chat">

        <small>SWITY AI • READY TO ASSIST</small>

        <div class="message" id="message">
            Hello Boss. Welcome back. I'm Swity, your personal AI assistant.
        </div>

        <div class="input-box">

            <input
            type="text"
            id="userInput"
            placeholder="Ask Swity anything..."
            >

            <button class="send" onclick="sendMessage()">➤</button>

        </div>

        <div class="controls">

            <button class="control active" onclick="startMic()">
                🎤 MIC
            </button>

            <button class="control" onclick="openSettings()">
                ⚙ SETTINGS
            </button>

            <button class="control active" id="voiceBtn" onclick="toggleVoice()">
                🔊 VOICE ON
            </button>

        </div>

    </section>

    <div class="status">
        GURU AI • SWITY CORE v1.0
    </div>

</main>

<script>

/* PARTICLES */

const particles=document.getElementById("particles");

for(let i=0;i<45;i++){

    const p=document.createElement("div");

    p.className="particle";

    p.style.left=Math.random()*100+"%";

    p.style.animationDuration=
    (4+Math.random()*8)+"s";

    p.style.animationDelay=
    (Math.random()*8)+"s";

    particles.appendChild(p);
}

/* SEND MESSAGE */

function sendMessage(){

    const input=document.getElementById("userInput");

    const message=document.getElementById("message");

    if(input.value.trim()!==""){

        message.innerHTML=
        "<b>BOSS:</b> "+input.value;

        input.value="";

        setTimeout(()=>{

            message.innerHTML=
            "<b>SWITY:</b> I'm ready, Boss. How can I help you?";

            if(voiceEnabled){

                speak("I'm ready Boss. How can I help you?");

            }

        },700);
    }
}

/* ENTER KEY */

document
.getElementById("userInput")
.addEventListener("keydown",function(e){

    if(e.key==="Enter"){

        sendMessage();

    }

});

/* VOICE */

let voiceEnabled=true;

function speak(text){

    if(!voiceEnabled)return;

    speechSynthesis.cancel();

    const speech=new SpeechSynthesisUtterance(text);

    speech.rate=.95;

    speech.pitch=1.15;

    speech.volume=1;

    speechSynthesis.speak(speech);
}

function toggleVoice(){

    voiceEnabled=!voiceEnabled;

    const btn=
    document.getElementById("voiceBtn");

    const status=
    document.getElementById("voiceStatus");

    if(voiceEnabled){

        btn.innerHTML="🔊 VOICE ON";

        btn.classList.add("active");

        status.innerText="ON";

        speak("Voice activated");

    }

    else{

        btn.innerHTML="🔇 VOICE OFF";

        btn.classList.remove("active");

        status.innerText="OFF";

        speechSynthesis.cancel();

    }
}

/* MICROPHONE */

function startMic(){

    const recognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

    if(!recognition){

        alert("Speech recognition is not supported in this browser.");

        return;

    }

    const mic=new recognition();

    mic.lang="en-IN";

    mic.start();

    mic.onresult=function(event){

        document.getElementById("userInput").value=
        event.results[0][0].transcript;

        sendMessage();

    };

}

/* SETTINGS */

function openSettings(){

    alert(
        "SWITY SETTINGS\n\n" +
        "AI Status: Active\n" +
        "Voice: "+(voiceEnabled?"ON":"OFF")+
        "\nVersion: GURU AI v1.0"
    );

}

/* START GREETING */

window.addEventListener("load",()=>{

    setTimeout(()=>{

        speak(
        "Hello Boss. Welcome back. I am Swity, your personal AI assistant."
        );

    },800);

});

</script>

</body>
</html>
