<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>GURU AI - SWITY</title><style>

/* ===============================
   RESET
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    background:#020609;
}

body{
    font-family:Arial,sans-serif;
    color:white;
    overflow:hidden;
}


/* ===============================
   MAIN APP
================================ */

.swity-app{
    width:100%;
    height:100vh;
    height:100svh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#020609;
}


/* ===============================
   MOBILE SCREEN
================================ */

.background-container{
    position:relative;

    width:100%;
    height:100vh;
    height:100svh;

    max-width:430px;

    overflow:hidden;

    background:#020609;

    isolation:isolate;
}


/* ===============================
   BACKGROUND IMAGE
================================ */

.background-image{
    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    object-fit:fill;

    display:block;

    z-index:0;

    pointer-events:none;

    user-select:none;

    -webkit-user-drag:none;
}


/* ===============================
   UI LAYER
================================ */

.ui-layer{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:10;
}


/* ===============================
   CHAT MESSAGE
================================ */

#chatMessage{
    position:absolute;

    left:18%;
    top:47.5%;

    width:64%;
    height:7%;

    z-index:20;

    overflow-y:auto;

    padding:5px 8px;

    font-size:13px;

    line-height:1.35;

    color:white;

    text-shadow:
        0 0 8px rgba(0,242,254,.7);

    pointer-events:none;

    scrollbar-width:none;
}

#chatMessage::-webkit-scrollbar{
    display:none;
}


/* ===============================
   INPUT
================================ */

.chat-input{
    position:absolute;

    left:18%;
    top:56.3%;

    width:54%;
    height:4.8%;

    z-index:30;

    border:none;
    outline:none;

    background:transparent;

    padding:5px 8px;

    color:white;

    font-size:14px;

    caret-color:#00f2fe;
}

.chat-input::placeholder{
    color:rgba(255,255,255,.75);
}


/* ===============================
   BUTTONS
================================ */

.menu-button,
.settings-button,
.send-button,
.mic-button,
.control-settings,
.voice-button{
    position:absolute;

    z-index:40;

    border:none;

    background:transparent;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;

    touch-action:manipulation;
}


/* MENU */

.menu-button{
    top:1%;
    left:1%;

    width:14%;
    height:8%;
}


/* TOP SETTINGS */

.settings-button{
    top:1%;
    right:1%;

    width:14%;
    height:8%;
}


/* SEND */

.send-button{
    top:55.5%;
    left:72%;

    width:14%;
    height:6.5%;
}


/* MICROPHONE */

.mic-button{
    left:16%;
    top:62%;

    width:23%;
    height:7%;
}


/* BOTTOM SETTINGS */

.control-settings{
    left:38%;
    top:62%;

    width:23%;
    height:7%;
}


/* VOICE */

.voice-button{
    left:61%;
    top:62%;

    width:24%;
    height:7%;
}


button:active{
    transform:scale(.92);
}


/* ===============================
   POPUP
================================ */

.popup{
    display:none;

    position:absolute;

    left:8%;
    top:10%;

    width:84%;

    max-height:40%;

    overflow-y:auto;

    z-index:100;

    padding:15px;

    border-radius:15px;

    background:rgba(2,10,18,.97);

    border:
        1px solid rgba(0,242,254,.7);

    box-shadow:
        0 0 25px rgba(0,242,254,.35);

    color:white;
}

.popup.active{
    display:block;
}

.popup h3{
    color:#00f2fe;

    text-align:center;

    margin-bottom:12px;
}

.popup p{
    margin-bottom:10px;
}

.popup button,
.popup select{
    width:100%;

    margin-top:10px;

    padding:11px;

    border-radius:8px;

    border:
        1px solid rgba(0,242,254,.5);

    background:
        rgba(0,242,254,.10);

    color:white;

    cursor:pointer;
}

.popup select{
    outline:none;
}


/* ===============================
   DESKTOP
================================ */

@media(min-width:431px){

    .background-container{
        box-shadow:
            0 0 40px rgba(0,242,254,.2);
    }

}

</style></head><body><div class="swity-app"><div class="background-container"><!-- BACKGROUND --><img
src="background.png"
class="background-image"
alt="GURU AI Background"

«»

<!-- UI LAYER --><div class="ui-layer"><!-- POPUP --><div
class="popup"
id="popup">
</div><!-- CHAT MESSAGE --><div id="chatMessage">
Hello Boss. Welcome back.
</div><!-- MENU --><button
class="menu-button"
onclick="openMenu()"
aria-label="Menu">
</button>

<!-- TOP SETTINGS --><button
class="settings-button"
onclick="openSettings()"
aria-label="Settings">
</button>

<!-- INPUT --><input
type="text"
class="chat-input"
id="userInput"
placeholder="Ask anything..."
autocomplete="off"

«»

<!-- SEND --><button
class="send-button"
onclick="sendMessage()"
aria-label="Send">
</button>

<!-- MICROPHONE --><button
class="mic-button"
onclick="startMic()"
aria-label="Microphone">
</button>

<!-- BOTTOM SETTINGS --><button
class="control-settings"
onclick="openSettings()"
aria-label="Control Settings">
</button>

<!-- VOICE --><button
class="voice-button"
onclick="toggleVoice()"
aria-label="Voice">
</button>

</div></div></div><script>

/* ===============================
   SETTINGS
================================ */

let voiceEnabled = true;
let selectedLanguage = "en-IN";


/* ===============================
   SPEAK
================================ */

function speak(text){

    if(!voiceEnabled) return;

    if(!("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = selectedLanguage;
    speech.rate = 0.95;
    speech.pitch = 1.1;
    speech.volume = 1;

    window.speechSynthesis.speak(speech);
}


/* ===============================
   SEND MESSAGE
================================ */

function sendMessage(){

    const input =
        document.getElementById("userInput");

    const message =
        document.getElementById("chatMessage");

    const text =
        input.value.trim();

    if(text === "") return;

    message.innerHTML =
        "<b>BOSS:</b> " + text;

    input.value = "";

    setTimeout(function(){

        const reply =
            "I'm ready, Boss. How can I help you?";

        message.innerHTML =
            "<b>GURU AI:</b> " + reply;

        speak(reply);

    },500);
}


/* ===============================
   ENTER KEY
================================ */

document
.getElementById("userInput")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            sendMessage();
        }

    }
);


/* ===============================
   VOICE
================================ */

function toggleVoice(){

    voiceEnabled =
        !voiceEnabled;

    const message =
        document.getElementById("chatMessage");

    if(voiceEnabled){

        message.innerHTML =
            "<b>GURU AI:</b> Voice activated.";

        speak("Voice activated Boss");

    }else{

        if("speechSynthesis" in window){

            window.speechSynthesis.cancel();
        }

        message.innerHTML =
            "<b>GURU AI:</b> Voice disabled.";
    }
}


/* ===============================
   MICROPHONE
================================ */

function startMic(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    const message =
        document.getElementById("chatMessage");

    if(!SpeechRecognition){

        message.innerHTML =
            "<b>GURU AI:</b> Speech recognition is not supported.";

        return;
    }

    const recognition =
        new SpeechRecognition();

    recognition.lang =
        selectedLanguage;

    recognition.interimResults =
        false;

    recognition.continuous =
        false;

    message.innerHTML =
        "<b>GURU AI:</b> Listening...";

    recognition.start();


    recognition.onresult =
        function(event){

            const transcript =
                event.results[0][0].transcript;

            document
            .getElementById("userInput")
            .value =
                transcript;

            sendMessage();
        };


    recognition.onerror =
        function(){

            message.innerHTML =
                "<b>GURU AI:</b> Microphone permission required.";
        };
}


/* ===============================
   SETTINGS POPUP
================================ */

function openSettings(){

    const popup =
        document.getElementById("popup");

    popup.innerHTML =

        `
        <h3>⚙ GURU AI SETTINGS</h3>

        <p>
        Voice: ${voiceEnabled ? "ON" : "OFF"}
        </p>

        <select onchange="changeLanguage(this.value)">

            <option value="en-IN">
            English
            </option>

            <option value="hi-IN">
            Hindi
            </option>

            <option value="mr-IN">
            Marathi
            </option>

        </select>

        <button onclick="toggleVoice()">
        🔊 Voice ON / OFF
        </button>

        <button onclick="closePopup()">
        CLOSE
        </button>
        `;

    popup.classList.add("active");
}


/* ===============================
   LANGUAGE
================================ */

function changeLanguage(value){

    selectedLanguage =
        value;

    document
    .getElementById("chatMessage")
    .innerHTML =
        "<b>GURU AI:</b> Language updated.";
}


/* ===============================
   MENU
================================ */

function openMenu(){

    const popup =
        document.getElementById("popup");

    popup.innerHTML =

        `
        <h3>☰ GURU AI MENU</h3>

        <button onclick="selectFeature('Learning')">
        📚 Learning
        </button>

        <button onclick="selectFeature('Trading')">
        📈 Trading
        </button>

        <button onclick="selectFeature('Coding')">
        💻 Coding
        </button>

        <button onclick="selectFeature('Technology')">
        ⚡ Technology
        </button>

        <button onclick="closePopup()">
        CLOSE
        </button>
        `;

    popup.classList.add("active");
}


/* ===============================
   FEATURE
================================ */

function selectFeature(feature){

    closePopup();

    const message =
        document.getElementById("chatMessage");

    message.innerHTML =
        "<b>GURU AI:</b> " +
        feature +
        " mode activated.";

    speak(
        feature +
        " mode activated Boss"
    );
}


/* ===============================
   CLOSE POPUP
================================ */

function closePopup(){

    document
    .getElementById("popup")
    .classList
    .remove("active");
}


/* ===============================
   WELCOME
================================ */

window.addEventListener(
    "load",
    function(){

        setTimeout(function(){

            speak(
                "Hello Boss. Welcome back. I am Swity, your personal Guru AI assistant."
            );

        },1000);

    }
);

</script></body>
</html>
