<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>GURU AI - SWITY</title>

<style>

/* ===============================
   RESET
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    background:#020609;
}

body{
    min-height:100vh;
    background:#020609;
    font-family:Arial, sans-serif;
    overflow-x:hidden;
    color:white;
}


/* ===============================
   MAIN SCREEN
================================ */

.swity-app{
    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    position:relative;

    background:
    radial-gradient(
        circle at center,
        rgba(0,242,254,.08),
        transparent 55%
    );
}


/* ===============================
   EXACT BACKGROUND IMAGE
================================ */

.background-container{

    width:100%;
    max-width:1024px;

    position:relative;

    overflow:hidden;

    box-shadow:
    0 0 40px rgba(0,242,254,.12);

}

.background-image{

    display:block;

    width:100%;
    height:auto;

    user-select:none;

    pointer-events:none;

}


/* ===============================
   ANIMATED CYBER LIGHT
================================ */

.cyber-light{

    position:absolute;

    inset:0;

    pointer-events:none;

    overflow:hidden;

    mix-blend-mode:screen;

}

.cyber-light::before{

    content:"";

    position:absolute;

    width:35%;

    height:140%;

    top:-20%;

    left:-40%;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(0,242,254,.08),
        rgba(0,255,180,.16),
        rgba(0,242,254,.08),
        transparent
    );

    transform:skewX(-12deg);

    filter:blur(12px);

    animation:lightMove 8s linear infinite;

}

.cyber-light::after{

    content:"";

    position:absolute;

    inset:0;

    background:

    radial-gradient(
        circle at 50% 30%,
        rgba(0,242,254,.12),
        transparent 22%
    ),

    radial-gradient(
        circle at 50% 80%,
        rgba(0,255,120,.10),
        transparent 25%
    );

    animation:pulseLight 4s ease-in-out infinite alternate;

}

@keyframes lightMove{

    0%{
        left:-45%;
    }

    100%{
        left:120%;
    }

}

@keyframes pulseLight{

    0%{
        opacity:.25;
    }

    100%{
        opacity:.8;
    }

}


/* ===============================
   PARTICLES
================================ */

.particles{

    position:absolute;

    inset:0;

    pointer-events:none;

    overflow:hidden;

}

.particle{

    position:absolute;

    width:3px;

    height:3px;

    border-radius:50%;

    background:#00f2fe;

    box-shadow:

    0 0 5px #00f2fe,

    0 0 12px #00f2fe;

    animation:particleFloat linear infinite;

}

@keyframes particleFloat{

    0%{

        transform:
        translateY(0)
        scale(.5);

        opacity:0;

    }

    15%{
        opacity:.8;
    }

    85%{
        opacity:.8;
    }

    100%{

        transform:
        translateY(-300px)
        scale(1.4);

        opacity:0;

    }

}


/* ===============================
   CLICKABLE MENU
================================ */

.menu-button{

    position:absolute;

    top:2%;

    left:2%;

    width:11%;

    height:7%;

    background:transparent;

    border:none;

    cursor:pointer;

}


/* ===============================
   CLICKABLE SETTINGS
================================ */

.settings-button{

    position:absolute;

    top:2%;

    right:2%;

    width:11%;

    height:7%;

    background:transparent;

    border:none;

    cursor:pointer;

}


/* ===============================
   CHAT INPUT
================================ */

.chat-input{

    position:absolute;

    left:18%;

    top:56.3%;

    width:55%;

    height:4.8%;

    background:transparent;

    border:none;

    outline:none;

    color:white;

    font-size:clamp(12px,2vw,22px);

    padding:10px 15px;

    font-family:Arial, sans-serif;

}


/* ===============================
   SEND BUTTON
================================ */

.send-button{

    position:absolute;

    top:56.2%;

    left:74.5%;

    width:8.5%;

    height:5.3%;

    border:none;

    background:transparent;

    cursor:pointer;

    border-radius:15px;

}

.send-button:active{

    transform:scale(.92);

}


/* ===============================
   MIC BUTTON
================================ */

.mic-button{

    position:absolute;

    left:17%;

    top:62.5%;

    width:20%;

    height:5%;

    border:none;

    background:transparent;

    cursor:pointer;

}


/* ===============================
   SETTINGS CONTROL
================================ */

.control-settings{

    position:absolute;

    left:39%;

    top:62.5%;

    width:21%;

    height:5%;

    border:none;

    background:transparent;

    cursor:pointer;

}


/* ===============================
   VOICE BUTTON
================================ */

.voice-button{

    position:absolute;

    left:62%;

    top:62.5%;

    width:21%;

    height:5%;

    border:none;

    background:transparent;

    cursor:pointer;

}


/* ===============================
   MOBILE FIX
================================ */

@media(max-width:600px){

    .background-container{

        width:100%;

        max-width:none;

    }

    .chat-input{

        font-size:14px;

        padding:4px 8px;

    }

}


/* ===============================
   DESKTOP
================================ */

@media(min-width:1025px){

    body{

        background:

        radial-gradient(
            circle at center,
            #07151a,
            #020609 70%
        );

    }

    .background-container{

        margin:20px auto;

        border-radius:10px;

    }

}

</style>

</head>


<body>


<div class="swity-app">

<div class="background-container">


<!-- EXACT BACKGROUND IMAGE -->

<img
src="swity-background.png"
class="background-image"
alt="GURU AI SWITY"
>


<!-- ANIMATED LIGHT -->

<div class="cyber-light"></div>


<!-- PARTICLES -->

<div
class="particles"
id="particles"
></div>


<!-- MENU -->

<button
class="menu-button"
onclick="openMenu()"
aria-label="Menu"
></button>


<!-- TOP SETTINGS -->

<button
class="settings-button"
onclick="openSettings()"
aria-label="Settings"
></button>


<!-- REAL CHAT INPUT -->

<input
type="text"
class="chat-input"
id="userInput"
placeholder="Ask Swity anything..."
autocomplete="off"
>


<!-- SEND -->

<button
class="send-button"
onclick="sendMessage()"
aria-label="Send"
></button>


<!-- MICROPHONE -->

<button
class="mic-button"
onclick="startMic()"
aria-label="Microphone"
></button>


<!-- SETTINGS -->

<button
class="control-settings"
onclick="openSettings()"
aria-label="Settings"
></button>


<!-- VOICE -->

<button
class="voice-button"
onclick="toggleVoice()"
aria-label="Voice"
></button>


</div>

</div>


<script>


/* ===============================
   PARTICLES
================================ */

const particleBox =
document.getElementById("particles");


for(let i = 0; i < 45; i++){

    const particle =
    document.createElement("div");

    particle.className =
    "particle";


    particle.style.left =
    Math.random() * 100 + "%";


    particle.style.top =
    Math.random() * 100 + "%";


    particle.style.animationDuration =
    4 + Math.random() * 7 + "s";


    particle.style.animationDelay =
    Math.random() * 5 + "s";


    particleBox.appendChild(
        particle
    );

}



/* ===============================
   SEND MESSAGE
================================ */

function sendMessage(){

    const input =
    document.getElementById(
        "userInput"
    );


    const text =
    input.value.trim();


    if(text === ""){
        return;
    }


    speak(
        "I received your message Boss. How can I help you?"
    );


    alert(
        "SWITY AI\n\nBoss: " +
        text +
        "\n\nMessage received."
    );


    input.value = "";

}



/* ENTER KEY */

document
.getElementById("userInput")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            sendMessage();

        }

    }
);



/* ===============================
   VOICE SYSTEM
================================ */

let voiceEnabled = true;


function speak(text){

    if(!voiceEnabled){
        return;
    }


    if(!("speechSynthesis" in window)){
        return;
    }


    window.speechSynthesis.cancel();


    const speech =
    new SpeechSynthesisUtterance(
        text
    );


    speech.rate = 0.95;

    speech.pitch = 1.15;

    speech.volume = 1;


    window.speechSynthesis.speak(
        speech
    );

}



/* ===============================
   TOGGLE VOICE
================================ */

function toggleVoice(){

    voiceEnabled =
    !voiceEnabled;


    if(voiceEnabled){

        speak(
            "Voice activated Boss"
        );


        alert(
            "SWITY VOICE: ON"
        );

    }

    else{

        window
        .speechSynthesis
        .cancel();


        alert(
            "SWITY VOICE: OFF"
        );

    }

}



/* ===============================
   MICROPHONE
================================ */

function startMic(){

    const SpeechRecognition =

    window.SpeechRecognition ||

    window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        alert(
            "Voice recognition is not supported in this browser."
        );

        return;

    }


    const recognition =
    new SpeechRecognition();


    recognition.lang =
    "en-IN";


    recognition.interimResults =
    false;


    recognition.maxAlternatives =
    1;


    recognition.start();



    recognition.onresult =
    function(event){

        const transcript =

        event.results[0][0]
        .transcript;


        document
        .getElementById(
            "userInput"
        )
        .value = transcript;


    };


    recognition.onerror =
    function(){

        alert(
            "Microphone could not start. Please allow microphone permission."
        );

    };

}



/* ===============================
   SETTINGS
================================ */

function openSettings(){

    const status =

    voiceEnabled ?

    "ON" :

    "OFF";


    alert(

        "GURU AI - SWITY SETTINGS\n\n" +

        "AI STATUS: ACTIVE\n" +

        "CORE: ONLINE\n" +

        "VOICE: " + status +

        "\nVERSION: 1.0"

    );

}



/* ===============================
   MENU
================================ */

function openMenu(){

    alert(

        "GURU AI\n\n" +

        "SWITY AI ASSISTANT\n" +

        "SYSTEM ONLINE\n\n" +

        "GURUKRUPATECH"

    );

}



/* ===============================
   START GREETING
================================ */

window.addEventListener(
    "load",
    function(){

        setTimeout(
            function(){

                speak(
                    "Hello Boss. Welcome back. I am Swity, your personal AI assistant."
                );

            },

            1000
        );

    }
);


</script>


</body>

</html>
