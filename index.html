<style>

/* ROOT */

:root{

--cyan:#00eaff;
--cyan-light:#73f8ff;
--green:#00f0a8;
--dark:#02080b;
--panel:rgba(2,15,21,.92);
--text:#e8fbff;
--muted:#84a8b0;

}


/* RESET */

*{

margin:0;
padding:0;
box-sizing:border-box;

}


html{

min-height:100%;

}


body{

width:100%;
min-height:100vh;

font-family:"Rajdhani",sans-serif;

color:var(--text);

background:#010607;

overflow-x:hidden;

}


/* BACKGROUND */

body::before{

content:"";

position:fixed;

inset:0;

z-index:-3;

background:

linear-gradient(
rgba(0,8,12,.48),
rgba(0,8,12,.68)
),

url("background.jpg.png");

background-size:cover;

background-position:center top;

background-repeat:no-repeat;

}


body::after{

content:"";

position:fixed;

inset:0;

z-index:-2;

pointer-events:none;

background:

radial-gradient(

circle at 50% 40%,

transparent 0%,

rgba(0,8,10,.20) 50%,

rgba(0,5,7,.65) 100%

);

}


/* APP */

.app{

width:100%;

max-width:520px;

min-height:100vh;

margin:auto;

padding:

20px
16px
30px;

position:relative;

}


/* CYBER GRID */

.cyber-grid{

position:fixed;

inset:0;

pointer-events:none;

opacity:.16;

z-index:-1;

linear-gradient(
rgba(0,234,255,.08) 1px,
transparent 1px
),

linear-gradient(
90deg,
rgba(0,234,255,.08) 1px,
transparent 1px
);

}

width:100%;

display:grid;

54px
1fr
54px;

height:46px;

border:

1px solid
rgba(0,234,255,.32);

background:

rgba(2,16,22,.82);

color:var(--cyan);

cursor:pointer;

box-shadow:

0 0 12px
rgba(0,234,255,.10),

}


.nav-btn:active{

}


.brand-sub{

font-size:7px;

}


.creator{

}

height:6px;

box-shadow:

}

.avatar-section{

height:285px;

display:flex;

align-items:center;

justify-content:center;

}

.hud-ring{

position:absolute;

border-radius:50%;

pointer-events:none;

}


.ring-1{

width:245px;

height:245px;

border:

1px solid

.ring-2{

width:205px;

height:205px;

border:

1px dashed
rgba(0,234,255,.25);

}


.ring-3{

width:165px;

height:165px;

border:

1px solid
rgba(0,240,168,.18);

}


@keyframes rotate{

to{

transform:rotate(360deg);

}

}


@keyframes reverseRotate{

to{

transform:rotate(-360deg);

}

}

.robot{

width:120px;

height:145px;

position:relative;

z-index:3;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

}


.antenna{

width:4px;

height:24px;

background:

linear-gradient(
var(--cyan),
white
);

border-radius:10px;

position:relative;

}


.antenna::before{

content:"";

position:absolute;

width:11px;

height:11px;

border-radius:50%;

top:-7px;

left:-3px;

background:var(--cyan-light);

box-shadow:

0 0 14px var(--cyan);

}


.robot-head{

width:116px;

height:76px;

padding:10px;

border-radius:

30px
30px
27px
27px;

background:

linear-gradient(
135deg,
#e9ffff,
#5f9ca5

0 0 24px
rgba(0,234,255,.38);

height:100%;

align-items:center;

justify-content:center;

gap:24px;

border:

1px solid
rgba(0,234,255,.35);

}


.eye{

width:12px;

height:12px;

border-radius:50%;

background:var(--cyan);

box-shadow:

0 0 14px var(--cyan);

@keyframes blink{

0%,45%,55%,100%{

50%{

transform:scaleY(.15);

width:72px;
