<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>GURU AI - SWITY</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --cyan:#00eaff;
    --cyan2:#00aaff;
    --green:#00ff88;
    --dark:#02070b;
    --glass:rgba(2,12,18,.78);
}

html{
    background:#010607;
}

body{
    min-height:100vh;
    background:#010607;
    color:white;
    font-family:Rajdhani,sans-serif;
    overflow-x:hidden;
}

/* ================= BACKGROUND ================= */

.background{
    position:fixed;
    inset:0;
    z-index:-5;
    overflow:hidden;

    background:
    radial-gradient(circle at 50% 42%,rgba(0,242,254,.13),transparent 25%),
    radial-gradient(circle at 50% 80%,rgba(0,255,100,.14),transparent 32%),
    linear-gradient(180deg,#02080c,#010807 55%,#020b08);
}

/* DIGITAL GRID */

.background::before{
    content:"";
    position:absolute;
    inset:0;

    opacity:.12;

    background-image:
    linear-gradient(rgba(0,242,254,.25) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,242,254,.18) 1px,transparent 1px);

    background-size:55px 55px;

    mask-image:linear-gradient(
        to bottom,
        transparent,
        black 40%,
        black
    );
}

/* MOVING LIGHT */

.background::after{
    content:"";
    position:absolute;
    width:150%;
    height:5px;

    top:0;
    left:-25%;

    background:linear-gradient(
        90deg,
        transparent,
        var(--cyan),
        transparent
    );

    filter:blur(3px);

    animation:scanner 7s linear infinite;

    opacity:.55;
}

@keyframes scanner{

    from{
        transform:translateY(-10vh);
    }

    to{
        transform:translateY(115vh);
    }

}

/* PARTICLES */

#particles{
    position:fixed;
    inset:0;
    z-index:-2;
    pointer-events:none;
}

.particle{
    position:absolute;
    width:2px;
    height:2px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
    0 0 8px var(--green),
    0 0 15px var(--cyan);

    animation:floatUp linear infinite;
}

@keyframes floatUp{

    from{
        transform:translateY(110vh);
        opacity:0;
    }

    20%{
        opacity:.8;
    }

    to{
        transform:translateY(-10vh);
        opacity:0;
    }

}

/* ================= APP ================= */

.app{
    width:min(100%,520px);
    min-height:100vh;

    margin:auto;

    padding:18px 14px 25px;

    position:relative;
}

/* ================= TOP ================= */

.top{
    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:8px 10px;

    border:1px solid rgba(0,234,255,.25);

    border-radius:14px;

    background:rgba(3,12,20,.7);

    box-shadow:
    inset 0 0 20px rgba(0,234,255,.04),
    0 0 20px rgba(0,234,255,.06);
}

.menu{
    font-size:28px;

    color:var(--cyan);

    cursor:pointer;

    text-shadow:0 0 15px var(--cyan);
}

.brand{
    text-align:center;
}

.brand h3{

    font-family:Orbitron;

    color:var(--green);

    font-size:14px;

    letter-spacing:5px;
}

.brand h1{

    font-family:Orbitron;

    font-size:30px;

    letter-spacing:7px;

    margin-top:3px;

    text-shadow:
    0 0 10px var(--cyan),
    0 0 25px rgba(0,242,254,.4);
}

.gear{
    font-size:25px;

    color:var(--cyan);

    cursor:pointer;
}

/* ================= STATUS ================= */

.status-row{

    display:flex;

    justify-content:space-between;

    gap:8px;

    margin-top:14px;
}

.status-box{

    flex:1;

    min-height:66px;

    padding:10px;

    border-radius:12px;

    border:1px solid rgba(0,234,255,.38);

    background:rgba(2,14,20,.68);

    box-shadow:
    0 0 12px rgba(0,234,255,.08),
    inset 0 0 12px rgba(0,255,136,.04);
}

.status-box span{

    font-family:Orbitron;

    font-size:7px;

    color:#8ea4ad;

    letter-spacing:1px;
}

.status-box b{

    display:block;

    margin-top:10px;

    font-family:Orbitron;

    color:var(--cyan);

    font-size:11px;
}

.dot{

    color:var(--green);

    text-shadow:0 0 10px var(--green);
}

/* ================= AI CORE ================= */

.ai-area{

    height:350px;

    position:relative;

    display:flex;

    justify-content:center;

    align-items:center;
}

/* OUTER RINGS */

.ring{

    position:absolute;

    border-radius:50%;
}

.ring1{

    width:310px;
    height:310px;

    border:2px dashed rgba(0,234,255,.55);

    box-shadow:0 0 25px rgba(0,234,255,.2);

    animation:rotate 20s linear infinite;
}

.ring2{

    width:270px;
    height:270px;

    border:2px solid rgba(0,255,136,.35);

    border-left-color:transparent;
    border-bottom-color:transparent;

    animation:rotateReverse 12s linear infinite;
}

.ring3{

    width:230px;
    height:230px;

    border:2px solid var(--cyan);

    border-top-color:transparent;

    box-shadow:
    0 0 25px rgba(0,234,255,.4),
    inset 0 0 25px rgba(0,234,255,.1);

    animation:rotate 8s linear infinite;
}

@keyframes rotate{

    to{
        transform:rotate(360deg);
    }

}

@keyframes rotateReverse{

    to{
        transform:rotate(-360deg);
    }

}

/* ================= ROBOT ================= */

.robot{

    position:relative;

    width:155px;

    height:145px;

    z-index:5;
}

/* HEAD */

.robot-head{

    position:absolute;

    top:12px;

    left:50%;

    transform:translateX(-50%);

    width:125px;

    height:92px;

    border-radius:40px 40px 34px 34px;

    background:

    linear-gradient(
        145deg,
        #d8f5ff,
        #5d9fb5 45%,
        #17313f
    );

    border:2px solid rgba(180,245,255,.75);

    box-shadow:
    0 0 25px rgba(0,234,255,.65),
    inset 0 0 20px rgba(255,255,255,.25);
}

/* ANTENNA */

.antenna{

    position:absolute;

    width:6px;

    height:28px;

    background:linear-gradient(var(--cyan),#dffcff);

    left:50%;

    top:-25px;

    transform:translateX(-50%);

    border-radius:10px;

    box-shadow:0 0 10px var(--cyan);
}

.antenna::before{

    content:"";

    position:absolute;

    width:18px;

    height:18px;

    border-radius:50%;

    background:#dffcff;

    top:-10px;

    left:-6px;

    box-shadow:0 0 15px var(--cyan);
}

/* FACE */

.face{

    position:absolute;

    left:17px;

    top:25px;

    width:88px;

    height:54px;

    border-radius:20px;

    background:#021019;

    box-shadow:
    inset 0 0 18px rgba(0,234,255,.15),
    0 0 12px rgba(0,0,0,.8);
}

.eye{

    position:absolute;

    width:16px;

    height:16px;

    border-radius:50%;

    top:17px;

    background:var(--cyan);

    box-shadow:
    0 0 12px var(--cyan),
    0 0 25px var(--cyan);

    animation:blink 4s infinite;
}

.eye.left{
    left:20px;
}

.eye.right{
    right:20px;
}

.mouth{

    position:absolute;

    width:24px;

    height:8px;

    border-bottom:3px solid var(--cyan);

    border-radius:50%;

    bottom:9px;

    left:32px;
}

@keyframes blink{

    0%,45%,55%,100%{
        transform:scaleY(1);
    }

    50%{
        transform:scaleY(.1);
    }

}

/* EARS */

.robot-head::before,
.robot-head::after{

    content:"";

    position:absolute;

    width:15px;

    height:40px;

    top:25px;

    background:#82bdcf;

    border:1px solid var(--cyan);
}

.robot-head::before{

    left:-14px;

    border-radius:12px 0 0 12px;
}

.robot-head::after{

    right:-14px;

    border-radius:0 12px 12px 0;
}

/* BODY */

.robot-body{

    position:absolute;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:105px;

    height:55px;

    border-radius:45px 45px 15px 15px;

    background:

    linear-gradient(
        180deg,
        #3f7588,
        #112a35
    );

    border:1px solid rgba(0,234,255,.45);

    box-shadow:0 0 20px rgba(0,234,255,.25);
}

/* SWITY NAME */

.swity-name{

    position:absolute;

    bottom:-48px;

    width:100%;

    text-align:center;

    font-family:Orbitron;

    font-size:27px;

    letter-spacing:8px;

    color:white;

    text-shadow:
    0 0 10px var(--cyan),
    0 0 25px var(--cyan);
}

.swity-core{

    position:absolute;

    bottom:-72px;

    width:100%;

    text-align:center;

    font-family:Orbitron;

    font-size:9px;

    letter-spacing:4px;

    color:var(--green);
}

/* ================= CHAT ================= */

.chat{

    position:relative;

    margin-top:5px;

    padding:18px;

    border-radius:24px;

    border:1px solid rgba(0,234,255,.65);

    background:

    linear-gradient(
        135deg,
        rgba(2,20,27,.9),
        rgba(1,9,14,.84)
    );

    box-shadow:
    0 0 25px rgba(0,234,255,.15),
    inset 0 0 30px rgba(0,255,136,.035);
}

.chat-title{

    font-family:Orbitron;

    color:var(--cyan);

    font-size:10px;

    letter-spacing:2px;
}

.message{

    margin-top:16px;

    font-size:20px;

    line-height:1.45;

    color:#e3f5f8;
}

/* ================= INPUT ================= */

.input-area{

    display:flex;

    gap:10px;

    margin-top:18px;
}

input{

    flex:1;

    min-width:0;

    padding:17px;

    color:white;

    font-family:Rajdhani;

    font-size:17px;

    outline:none;

    border-radius:15px;

    border:1px solid rgba(0,234,255,.45);

    background:rgba(0,0,0,.4);
}

input::placeholder{

    color:#849aa3;
}

.send{

    width:64px;

    border:none;

    border-radius:17px;

    cursor:pointer;

    font-size:26px;

    color:#002b35;

    background:

    linear-gradient(
        135deg,
        #8cf7ff,
        var(--cyan)
    );

    box-shadow:
    0 0 22px rgba(0,234,255,.6);
}

/* ================= CONTROLS ================= */

.controls{

    display:flex;

    gap:10px;

    margin-top:18px;
}

.control{

    flex:1;

    padding:15px 4px;

    border-radius:15px;

    color:#e9f9ff;

    background:rgba(2,14,22,.85);

    border:1px solid rgba(0,234,255,.4);

    font-family:Orbitron;

    font-size:10px;

    letter-spacing:1px;

    cursor:pointer;

    transition:.25s;
}

.control:hover{

    box-shadow:
    0 0 20px rgba(0,234,255,.35);
}

.control:active{

    transform:scale(.96);
}

.active{

    box-shadow:
    0 0 15px rgba(0,234,255,.25),
    inset 0 0 15px rgba(0,234,255,.05);
}

/* ================= BOTTOM ================= */

.footer{

    margin-top:20px;

    text-align:center;

    font-family:Orbitron;

    font-size:9px;

    letter-spacing:3px;

    color:var(--green);

    padding:10px;

    border:1px solid rgba(0,255,136,.25);

    border-radius:10px;

    background:rgba(0,20,15,.3);
}

/* MOBILE */

@media(max-width:380px){

    .brand h1{
        font-size:25px;
    }

    .ring1{
        width:270px;
        height:270px;
    }

    .ring2{
        width:235px;
        height:235px;
    }

    .ring3{
        width:205px;
        height:205px;
    }

    .message{
        font-size:18px;
    }

}

</style>
</head>

<body>

<div class="background"></div>

<div id="particles"></div>

<main class="app">

    <!-- TOP -->

    <div class="top">

        <div class="menu">☰</div>

        <div class="brand">
            <h3>GURUKRUPATECH</h3>
            <h1>SWITY</h1>
        </div>

        <div class="gear"
        onclick="openSettings()">⚙</div>

    </div>


    <!-- STATUS -->

    <div class="status-row">

        <div class="status-box">
            <span>AI STATUS</span>
            <b><span class="dot">●</span> ACTIVE</b>
        </div>

        <div class="status-box">
            <span>CORE</span>
            <b><span class="dot">●</span> ONLINE</b>
        </div>

        <div class="status-box">
            <span>VOICE</span>
            <b id="voiceStatus">
                <span class="dot">●</span> ON
            </b>
        </div>

    </div>


    <!-- AI -->

    <div class="ai-area">

        <div class="ring ring1"></div>
        <div class="ring ring2"></div>
        <div class="ring ring3"></div>


        <div class="robot">

            <div class="robot-head">

                <div class="antenna"></div>

                <div class="face">

                    <div class="eye left"></div>
                    <div class="eye right"></div>

                    <div class="mouth"></div>

                </div>

            </div>

            <div class="robot-body"></div>

        </div>


        <div class="swity-name">
            SWITY
        </div>

        <div class="swity-core">
            AI CORE
        </div>

    </div>


    <!-- CHAT -->

    <section class="chat">

        <div class="chat-title">
            SWITY AI • READY TO ASSIST
        </div>

        <div
        class="message"
        id="message">

            Hello Boss. Welcome back.<br>

            I'm Swity, your personal AI assistant.

        </div>


        <!-- INPUT -->

        <div class="input-area">

            <input
            type="text"
            id="userInput"
            placeholder="Ask Swity anything..."
            >

            <button
            class="send"
            onclick="sendMessage()">

                ➤

            </button>

        </div>


        <!-- BUTTONS -->

        <div class="controls">

            <button
            class="control active"
            onclick="startMic()">

                🎙 MIC

            </button>


            <button
            class="control"
            onclick="openSettings()">

                ⚙ SETTINGS

            </button>


            <button
            class="control active"
            id="voiceBtn"
            onclick="toggleVoice()">

                🔊 VOICE ON

            </button>

        </div>

    </section>


    <!-- FOOTER -->

    <div class="footer">

        GURU AI • SWITY CORE v1.0

    </div>

</main>


<script>

/* ================= PARTICLES ================= */

const particles =
document.getElementById("particles");

for(let i=0;i<70;i++){

    const p =
    document.createElement("div");

    p.className =
    "particle";

    p.style.left =
    Math.random()*100+"%";

    p.style.top =
    Math.random()*100+"%";

    p.style.animationDuration =
    (6+Math.random()*10)+"s";

    p.style.animationDelay =
    (Math.random()*8)+"s";

    particles.appendChild(p);

}


/* ================= MESSAGE ================= */

function sendMessage(){

    const input =
    document.getElementById("userInput");

    const message =
    document.getElementById("message");

    const text =
    input.value.trim();

    if(text==="") return;


    message.innerHTML =
    "<b style='color:#00eaff'>BOSS:</b><br>"
    + text;


    input.value="";


    setTimeout(()=>{

        message.innerHTML =
        "<b style='color:#00eaff'>SWITY:</b><br>"
        + "I'm ready, Boss. How can I help you?";


        if(voiceEnabled){

            speak(
                "I'm ready Boss. How can I help you?"
            );

        }

    },800);

}


/* ENTER */

document
.getElementById("userInput")
.addEventListener(
"keydown",
function(e){

    if(e.key==="Enter"){

        sendMessage();

    }

});


/* ================= VOICE ================= */

let voiceEnabled=true;


function speak(text){

    if(!voiceEnabled)return;

    if(!("speechSynthesis" in window))return;


    speechSynthesis.cancel();


    const speech =
    new SpeechSynthesisUtterance(text);


    speech.lang="en-IN";

    speech.rate=.95;

    speech.pitch=1.15;

    speech.volume=1;


    speechSynthesis.speak(speech);

}


function toggleVoice(){

    voiceEnabled =
    !voiceEnabled;


    const btn =
    document.getElementById("voiceBtn");


    const status =
    document.getElementById("voiceStatus");


    if(voiceEnabled){

        btn.innerHTML =
        "🔊 VOICE ON";

        status.innerHTML =
        "<span class='dot'>●</span> ON";

        speak("Voice activated");

    }

    else{

        btn.innerHTML =
        "🔇 VOICE OFF";

        status.innerHTML =
        "● OFF";

        speechSynthesis.cancel();

    }

}


/* ================= MICROPHONE ================= */

function startMic(){

    const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


    if(!Recognition){

        alert(
        "Speech recognition is not supported in this browser."
        );

        return;

    }


    const mic =
    new Recognition();


    mic.lang="en-IN";


    mic.start();


    mic.onresult =
    function(event){

        document
        .getElementById("userInput")
        .value =
        event.results[0][0].transcript;


        sendMessage();

    };

}


/* ================= SETTINGS ================= */

function openSettings(){

    alert(

        "SWITY SETTINGS\n\n" +

        "AI Status: ACTIVE\n" +

        "Core: ONLINE\n" +

        "Voice: " +

        (voiceEnabled ? "ON" : "OFF") +

        "\nVersion: GURU AI v1.0"

    );

}


/* ================= GREETING ================= */

window
.addEventListener(
"load",
function(){

    setTimeout(function(){

        speak(

        "Hello Boss. Welcome back. "
        +
        "I am Swity, your personal AI assistant."

        );

    },1000);

});

</script>

</body>
</html>
