<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>GURU AI - SWITY</title>

<style>

/* ===============================
   RESET
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    background:#020609;
}

body{
    font-family:Arial,sans-serif;
    overflow:hidden;
    color:white;
}


/* ===============================
   MAIN APP
================================ */

.swity-app{
    width:100%;
    height:100vh;
    height:100svh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#020609;
}


/* ===============================
   BACKGROUND CONTAINER
================================ */

.background-container{
    position:relative;

    width:100%;
    height:100vh;
    height:100svh;

    max-width:600px;

    overflow:hidden;

    background:#020609;

    box-shadow:
    0 0 40px rgba(0,242,254,.18);
}


/* ===============================
   BACKGROUND IMAGE
================================ */

.background-image{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center top;

    display:block;

    user-select:none;
    pointer-events:none;

    z-index:1;
}


/* ===============================
   CYBER LIGHT
================================ */

.cyber-light{
    position:absolute;
    inset:0;

    z-index:5;

    pointer-events:none;

    overflow:hidden;

    mix-blend-mode:screen;
}

.cyber-light::before{
    content:"";

    position:absolute;

    width:35%;
    height:140%;

    top:-20%;
    left:-45%;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(0,242,254,.04),
        rgba(0,255,180,.14),
        rgba(0,242,254,.04),
        transparent
    );

    transform:skewX(-12deg);

    filter:blur(12px);

    animation:lightMove 9s linear infinite;
}

.cyber-light::after{
    content:"";

    position:absolute;
    inset:0;

    background:
    radial-gradient(
        circle at 50% 30%,
        rgba(0,242,254,.07),
        transparent 28%
    );

    animation:pulseLight 4s ease-in-out infinite alternate;
}

@keyframes lightMove{
    from{left:-45%;}
    to{left:120%;}
}

@keyframes pulseLight{
    from{opacity:.3;}
    to{opacity:.8;}
}


/* ===============================
   PARTICLES
================================ */

.particles{
    position:absolute;
    inset:0;

    z-index:6;

    pointer-events:none;
    overflow:hidden;
}

.particle{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#00f2fe;

    box-shadow:
    0 0 6px #00f2fe,
    0 0 14px #00f2fe;

    animation:particleFloat linear infinite;
}

@keyframes particleFloat{

    0%{
        transform:translateY(20px) scale(.5);
        opacity:0;
    }

    15%{
        opacity:.7;
    }

    85%{
        opacity:.7;
    }

    100%{
        transform:translateY(-350px) scale(1.3);
        opacity:0;
    }
}


/* ===============================
   CHAT MESSAGE
================================ */

#chatMessage{
    position:absolute;

    left:18%;
    top:47.5%;

    width:64%;
    height:7.5%;

    overflow-y:auto;

    padding:6px 8px;

    color:white;

    font-size:clamp(12px,3vw,17px);

    line-height:1.3;

    text-shadow:
    0 0 8px rgba(0,242,254,.4);

    z-index:20;

    pointer-events:none;

    scrollbar-width:none;
}

#chatMessage::-webkit-scrollbar{
    display:none;
}


/* ===============================
   BUTTONS
================================ */

.menu-button,
.settings-button,
.chat-input,
.send-button,
.mic-button,
.control-settings,
.voice-button{
    position:absolute;
    z-index:30;
}


/* MENU */

.menu-button{
    top:2%;
    left:2%;

    width:12%;
    height:7%;

    border:none;
    background:transparent;

    cursor:pointer;
}


/* TOP SETTINGS */

.settings-button{
    top:2%;
    right:2%;

    width:12%;
    height:7%;

    border:none;
    background:transparent;

    cursor:pointer;
}


/* INPUT */

.chat-input{
    left:18%;
    top:56.3%;

    width:54%;
    height:4.8%;

    padding:6px 8px;

    border:none;
    outline:none;

    background:transparent;

    color:white;

    font-size:clamp(12px,3vw,18px);
}

.chat-input::placeholder{
    color:rgba(255,255,255,.55);
}


/* SEND */

.send-button{
    top:56.2%;
    left:73%;

    width:11%;
    height:5.5%;

    border:none;

    background:transparent;

    cursor:pointer;

    border-radius:15px;
}

.send-button:active{
    transform:scale(.90);
}


/* MIC */

.mic-button{
    left:17%;
    top:62.5%;

    width:21%;
    height:5.5%;

    border:none;

    background:transparent;

    cursor:pointer;
}


/* SETTINGS */

.control-settings{
    left:39%;
    top:62.5%;

    width:21%;
    height:5.5%;

    border:none;

    background:transparent;

    cursor:pointer;
}


/* VOICE */

.voice-button{
    left:62%;
    top:62.5%;

    width:22%;
    height:5.5%;

    border:none;

    background:transparent;

    cursor:pointer;
}


/* ===============================
   COMPACT POPUP PANEL
================================ */

.popup{
    display:none;

    position:absolute;

    left:8%;
    right:8%;

    top:11%;

    max-height:32%;

    overflow-y:auto;

    padding:14px;

    border-radius:15px;

    background:
    rgba(2,12,18,.94);

    border:
    1px solid rgba(0,242,254,.45);

    box-shadow:
    0 0 25px rgba(0,242,254,.18);

    z-index:50;

    font-size:14px;

    line-height:1.6;
}

.popup.active{
    display:block;
}

.popup-title{
    color:#00f2fe;

    font-weight:bold;

    margin-bottom:8px;

    letter-spacing:1px;
}

.popup button,
.popup select{
    width:100%;

    margin-top:8px;

    padding:9px;

    border-radius:8px;

    border:
    1px solid rgba(0,242,254,.25);

    background:
    rgba(0,242,254,.06);

    color:white;

    cursor:pointer;
}

.popup select{
    outline:none;
}


/* ===============================
   DESKTOP
================================ */

@media(min-width:601px){

    .background-container{
        border-radius:12px;
    }

}

</style>

</head>


<body>

<div class="swity-app">

<div class="background-container">


<!-- BACKGROUND -->

<img
src="background.png"
class="background-image"
alt="GURU AI SWITY"
>


<div class="cyber-light"></div>


<div
class="particles"
id="particles">
</div>


<!-- POPUP -->

<div
class="popup"
id="popup">
</div>


<!-- CHAT MESSAGE -->

<div
id="chatMessage">

Hello Boss. Welcome back. I'm Swity, your GURU AI assistant.

</div>


<!-- MENU BUTTON -->

<button
class="menu-button"
onclick="openMenu()"
aria-label="Menu">
</button>


<!-- SETTINGS TOP -->

<button
class="settings-button"
onclick="openSettings()"
aria-label="Settings">
</button>


<!-- INPUT -->

<input
type="text"
class="chat-input"
id="userInput"
placeholder="Ask Swity anything..."
autocomplete="off"
>


<!-- SEND -->

<button
class="send-button"
onclick="sendMessage()"
aria-label="Send">
</button>


<!-- MIC -->

<button
class="mic-button"
onclick="startMic()"
aria-label="Microphone">
</button>


<!-- CONTROL SETTINGS -->

<button
class="control-settings"
onclick="openSettings()"
aria-label="Settings">
</button>


<!-- VOICE -->

<button
class="voice-button"
onclick="toggleVoice()"
aria-label="Voice">
</button>


</div>

</div>


<script>


/* ===============================
   PARTICLES
================================ */

const particleBox =
document.getElementById("particles");

for(let i=0;i<35;i++){

    const particle =
    document.createElement("div");

    particle.className =
    "particle";

    particle.style.left =
    Math.random()*100+"%";

    particle.style.top =
    Math.random()*100+"%";

    particle.style.animationDuration =
    (5+Math.random()*6)+"s";

    particle.style.animationDelay =
    (Math.random()*5)+"s";

    particleBox.appendChild(particle);

}


/* ===============================
   AI SETTINGS
================================ */

let voiceEnabled = true;

let selectedLanguage = "en-IN";

let voiceRate = 0.95;

let voicePitch = 1.15;


/* ===============================
   SPEAK
================================ */

function speak(text){

    if(!voiceEnabled)return;

    if(!("speechSynthesis" in window))return;

    window.speechSynthesis.cancel();

    const speech =
    new SpeechSynthesisUtterance(text);

    speech.lang =
    selectedLanguage;

    speech.rate =
    voiceRate;

    speech.pitch =
    voicePitch;

    speech.volume = 1;

    window.speechSynthesis.speak(speech);

}


/* ===============================
   SEND MESSAGE
================================ */

function sendMessage(){

    const input =
    document.getElementById("userInput");

    const chatMessage =
    document.getElementById("chatMessage");

    const text =
    input.value.trim();

    if(text==="")return;

    closePopup();

    chatMessage.innerHTML =
    "<b>BOSS:</b> "+text;

    input.value="";


    setTimeout(function(){

        let reply;

        const message =
        text.toLowerCase();


        if(
            message.includes("hello") ||
            message.includes("hi")
        ){

            reply =
            "Hello Boss. How can I assist you today?";

        }

        else if(
            message.includes("learn") ||
            message.includes("learning")
        ){

            reply =
            "Learning mode is ready. Choose any topic and I will help you understand it.";

        }

        else if(
            message.includes("trading")
        ){

            reply =
            "Trading learning mode is ready. We can learn market basics, price action and technical analysis.";

        }

        else if(
            message.includes("coding") ||
            message.includes("html") ||
            message.includes("javascript")
        ){

            reply =
            "Coding mode is ready. I can help you learn HTML, CSS and JavaScript.";

        }

        else{

            reply =
            "I'm ready, Boss. I received your message. How can I help you further?";

        }


        chatMessage.innerHTML =
        "<b>SWITY:</b> "+reply;

        speak(reply);

    },500);

}


/* ===============================
   ENTER
================================ */

document
.getElementById("userInput")
.addEventListener(
    "keydown",
    function(event){

        if(event.key==="Enter"){

            sendMessage();

        }

    }
);


/* ===============================
   VOICE TOGGLE
================================ */

function toggleVoice(){

    voiceEnabled =
    !voiceEnabled;


    if(voiceEnabled){

        document
        .getElementById("chatMessage")
        .innerHTML =
        "<b>SWITY:</b> Voice activated.";

        speak("Voice activated Boss");

    }

    else{

        window.speechSynthesis.cancel();

        document
        .getElementById("chatMessage")
        .innerHTML =
        "<b>SWITY:</b> Voice disabled.";

    }

}


/* ===============================
   MICROPHONE
================================ */

function startMic(){

    const SpeechRecognition =

    window.SpeechRecognition ||

    window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        document
        .getElementById("chatMessage")
        .innerHTML =
        "<b>SWITY:</b> Speech recognition is not supported in this browser.";

        return;

    }


    const recognition =
    new SpeechRecognition();


    recognition.lang =
    selectedLanguage;

    recognition.interimResults =
    false;

    recognition.maxAlternatives =
    1;


    recognition.start();


    document
    .getElementById("chatMessage")
    .innerHTML =
    "<b>SWITY:</b> Listening...";


    recognition.onresult =
    function(event){

        const transcript =
        event.results[0][0].transcript;


        document
        .getElementById("userInput")
        .value =
        transcript;


        sendMessage();

    };


    recognition.onerror =
    function(){

        document
        .getElementById("chatMessage")
        .innerHTML =
        "<b>SWITY:</b> Microphone permission required.";

    };

}


/* ===============================
   POPUP CLOSE
================================ */

function closePopup(){

    document
    .getElementById("popup")
    .classList
    .remove("active");

}


/* ===============================
   SETTINGS
================================ */

function openSettings(){

    const popup =
    document.getElementById("popup");


    popup.innerHTML =

    `<div class="popup-title">
    ⚙ GURU AI SETTINGS
    </div>

    <div>
    Voice: ${voiceEnabled ? "ON" : "OFF"}
    </div>

    <label>
    Language
    </label>

    <select
    onchange="changeLanguage(this.value)"
    >

    <option value="en-IN">
    English
    </option>

    <option value="hi-IN">
    Hindi
    </option>

    <option value="mr-IN">
    Marathi
    </option>

    </select>


    <label>
    Voice Speed
    </label>

    <select
    onchange="changeRate(this.value)"
    >

    <option value="0.75">
    Slow
    </option>

    <option value="0.95" selected>
    Normal
    </option>

    <option value="1.15">
    Fast
    </option>

    </select>


    <label>
    Voice Pitch
    </label>

    <select
    onchange="changePitch(this.value)"
    >

    <option value="0.8">
    Deep
    </option>

    <option value="1.15" selected>
    Normal
    </option>

    <option value="1.5">
    High
    </option>

    </select>


    <button onclick="toggleVoice()">
    🔊 VOICE ON / OFF
    </button>

    <button onclick="closePopup()">
    CLOSE
    </button>`;


    popup.classList.add("active");

}


/* ===============================
   SETTINGS FUNCTIONS
================================ */

function changeLanguage(value){

    selectedLanguage =
    value;

}


function changeRate(value){

    voiceRate =
    Number(value);

}


function changePitch(value){

    voicePitch =
    Number(value);

}


/* ===============================
   MENU
================================ */

function openMenu(){

    const popup =
    document.getElementById("popup");


    popup.innerHTML =

    `<div class="popup-title">
    ☰ GURU AI MENU
    </div>

    <button onclick="selectFeature('Learning')">
    📚 LEARNING MODE
    </button>

    <button onclick="selectFeature('Trading')">
    📈 TRADING MODE
    </button>

    <button onclick="selectFeature('Coding')">
    💻 CODING MODE
    </button>

    <button onclick="selectFeature('Technology')">
    ⚡ TECHNOLOGY
    </button>

    <button onclick="selectFeature('Creative')">
    🎨 CREATIVE MODE
    </button>

    <button onclick="closePopup()">
    CLOSE
    </button>`;


    popup.classList.add("active");

}


/* ===============================
   FEATURE SELECT
================================ */

function selectFeature(feature){

    closePopup();

    const chatMessage =
    document.getElementById("chatMessage");


    chatMessage.innerHTML =
    "<b>SWITY:</b> "+feature+
    " mode activated, Boss.";

    speak(
        feature+
        " mode activated Boss."
    );

}


/* ===============================
   GREETING
================================ */

window.addEventListener(
    "load",
    function(){

        setTimeout(function(){

            speak(
                "Hello Boss. Welcome back. I am Swity, your personal Guru AI assistant."
            );

        },1000);

    }
);


</script>

</body>
</html>
